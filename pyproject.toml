[project]
name = "macrocontroller"
version = "0.1.0"
description = "Mapeador de controle Xbox para teclado/mouse com overlay de skills"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
